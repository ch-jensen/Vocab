# Builds the Windows installer for the desktop app.
#
# Runs on every push to main that touches desktop/ (installer kept as a build
# artifact for 14 days), and on tags like desktop-v0.2.0, which also publish a
# GitHub release with VocabSetup-0.2.0.exe attached.

name: Desktop installer

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-release.yml"]
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write    # for creating the release on tags

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      BHSA_VERSION: "2021"
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      # A python.org Python (not Anaconda) avoids the DLL problems described in desktop/README.md.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Cache BHSA data
        uses: actions/cache@v4
        with:
          path: ~/text-fabric-data/github/ETCBC/bhsa/tf/${{ env.BHSA_VERSION }}
          key: bhsa-${{ env.BHSA_VERSION }}-v1

      - name: Download BHSA (if not cached)
        env:
          GHPERS: ${{ secrets.GITHUB_TOKEN }}   # avoids GitHub API rate limits in Text-Fabric
        run: python -c "from tf.app import use; use('ETCBC/bhsa', version='${{ env.BHSA_VERSION }}', mod=None, hoist=False, silent='deep')"

      - name: Build the vocabulary database
        run: python build_db.py --version ${{ env.BHSA_VERSION }}

      - name: Run tests
        run: python -m pytest -q

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/desktop-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(python -c 'import vocab; print(vocab.__version__)')-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app with PyInstaller
        run: pyinstaller packaging/vocab.spec --noconfirm --distpath dist --workpath build

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process dist\Vocab\Vocab.exe -ArgumentList "--self-test", "selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Build the installer with Inno Setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.version.outputs.version }}" packaging\vocab.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: VocabSetup-${{ steps.version.outputs.version }}
          path: desktop/dist/VocabSetup-*.exe
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vocab ${{ steps.version.outputs.version }}
          files: desktop/dist/VocabSetup-*.exe
          body: |
            Windows installer for Vocab, the Biblical Hebrew vocabulary trainer.
            Download VocabSetup-${{ steps.version.outputs.version }}.exe and run it; no Python needed.
            Windows may warn that the publisher is unknown, because the installer is not code-signed:
            choose "More info" → "Run anyway".
